routes:
  /tintinnabuli/:
    controller: channel
    filter: tag:[superorganismen,komplexitet]
    template: collections
  /noveller/:
    controller: channel
    filter: tag:[flickan-vid-pianot,dikter,breven-till-dion,avtryck-i-själen]
    template: noveller
  /recensioner/:
    controller: channel
    filter: tag:[recensioner]
    template: index

